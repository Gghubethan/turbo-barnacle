# 镜片产品标准库（PRODUCT = 系列级设计；折射率/膜层/版本组合见 skus.csv）
# 字段对照：brand 品牌 / series 系列 / name 产品名称 / product_type 产品类型 / official_tech_names 官方技术名称 /
# official_claims 官方描述 / mechanisms 技术机制 / effects 光学效果 / functions 标准功能标签（设计层） /
# values 用户价值 / problems 主要解决问题 / population 适用人群 / age 年龄 / symptoms 主观症状 / scenes 使用场景 /
# exams 关联验光指标 / required_conditions 必须条件 / suggested_conditions 建议条件 / exclusion_conditions 排除条件 /
# function_levels 功能等级 / price_tier 价格层级 / evidence_notes 证据说明 / sources 资料来源 / version 当前版本 /
# open_questions 待确认问题。与其他产品关系见 relations/product_relations.csv。
# 标签按证据等级分组：{A: [...], B: [...], C: [...]}；缺省组表示无。
