<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕骑自行车 · SVG 2D 动画</title>
<style>
  :root {
    --ink: #1f2937;
    --muted: #4b5563;
    --accent: #2a9d8f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 24px 16px;
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--ink);
    background: radial-gradient(1200px 600px at 50% -10%, #fff7e6 0%, #dbeafe 45%, #bfdbfe 100%);
  }
  h1 {
    margin: 0;
    font-size: clamp(20px, 3vw, 30px);
    font-weight: 700;
    letter-spacing: .5px;
  }
  .stage {
    width: min(960px, 100%);
    aspect-ratio: 16 / 9;
    border-radius: 18px;
    overflow: hidden;
    background: #7ec8f6;
    box-shadow: 0 20px 50px rgba(15, 23, 42, .25), 0 2px 6px rgba(15, 23, 42, .15);
    cursor: pointer;
    user-select: none;
  }
  svg { display: block; width: 100%; height: 100%; }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 12px 22px;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    color: var(--muted);
  }
  .controls label { display: inline-flex; align-items: center; gap: 8px; }
  button {
    font: inherit;
    padding: 8px 16px;
    border-radius: 999px;
    border: 1px solid rgba(31, 41, 55, .15);
    background: #fff;
    color: var(--ink);
    cursor: pointer;
    box-shadow: 0 1px 2px rgba(0, 0, 0, .08);
  }
  button:hover { background: #f8fafc; }
  input[type="range"] { accent-color: var(--accent); width: 150px; }
  .hint { font-size: 12px; color: var(--muted); opacity: .8; }

  /* ---------- 纯 CSS 驱动的环境小动画（暂停时一并冻结） ---------- */
  #scene.paused * { animation-play-state: paused !important; }

  @keyframes spin { to { transform: rotate(360deg); } }
  #rays { transform-box: fill-box; transform-origin: 50% 50%; animation: spin 48s linear infinite; }

  @keyframes flicker {
    0%   { opacity: 0;  transform: translateX(0); }
    25%  { opacity: .9; }
    60%  { opacity: 0;  transform: translateX(-46px); }
    100% { opacity: 0;  transform: translateX(-46px); }
  }
  .speedline { animation: flicker .75s linear infinite; }
  .speedline:nth-child(2) { animation-delay: -.25s; }
  .speedline:nth-child(3) { animation-delay: -.5s; }

  @keyframes puff {
    0%   { opacity: .55; transform: translate(0, 0) scale(.4); }
    100% { opacity: 0;   transform: translate(-70px, -24px) scale(1.7); }
  }
  .puff { transform-box: fill-box; transform-origin: center; animation: puff 1s ease-out infinite; }
  .puff:nth-child(2) { animation-delay: -.5s; }

  @keyframes flap { from { transform: scaleY(.3); } to { transform: scaleY(1); } }
  .bird { transform-box: fill-box; transform-origin: center; animation: flap .7s ease-in-out infinite alternate; }
  .bird:nth-child(2) { animation-delay: -.3s; }
  .bird:nth-child(3) { animation-delay: -.55s; }

  @keyframes blink { 0%, 40% { opacity: 1; } 50%, 100% { opacity: .1; } }
  .beacon { animation: blink 2.4s ease-in-out infinite; }
</style>
</head>
<body>

<h1>🚲 鹈鹕骑自行车</h1>

<div class="stage" id="stage" title="点击画面：暂停 / 继续">
<svg id="scene" viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sceneTitle sceneDesc">

  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">

</div>

<div class="controls">
  <button id="toggle" type="button" aria-pressed="false">⏸ 暂停</button>
  <label>速度
    <input id="speed" type="range" min="0.25" max="2" step="0.05" value="1" aria-label="骑行速度">
    <span id="speedVal">1.0×</span>
  </label>
  <span class="hint">点击画面或按空格键可暂停 / 继续</span>
</div>

<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const NS = 'http://www.w3.org/2000/svg';
  const W = 960;                               // 视差层的循环周期（= viewBox 宽度）

  /* ---------- 几何常量（与 SVG 中的坐标一致） ---------- */
  const R_WHEEL = 56;
  const REAR  = { x: 300, y: 406 };
  const FRONT = { x: 516, y: 406 };
  const BB    = { x: 402, y: 416 };           // 中轴
  const CRANK = 30, RING = 24, COG = 9;        // 曲柄长、牙盘半径、飞轮半径
  const RATIO = RING / COG;                    // 传动比：曲柄转一圈，后轮转 RATIO 圈
  const HIP   = { x: 375, y: 296 };           // 髋关节（腿从这里伸出）
  const THIGH = 58, SHANK = 98;                // 两段腿长：可见的"大腿"较短，跗跖较长
  const BASE_SPEED = 480;                      // 基础地面速度（px/s）

  /* ---------- 工具 ---------- */
  const el = (name, attrs, parent) => {
    const e = document.createElementNS(NS, name);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  };
  const f = n => n.toFixed(2);

  /* ---------- 生成重复性的图形 ---------- */
  // 车轮辐条
  const spokes = $('spokes');
  for (let i = 0; i < 12; i++) {
    const a = i * Math.PI / 6;
    el('line', { x1: f(7 * Math.cos(a)), y1: f(7 * Math.sin(a)), x2: f(50 * Math.cos(a)), y2: f(50 * Math.sin(a)) }, spokes);
  }
  // 太阳光芒
  const rays = $('rays');
  for (let i = 0; i < 12; i++) el('path', { d: 'M0 -46 L5 -76 L-5 -76 Z', transform: `rotate(${i * 30})` }, rays);
  // 海浪：波长必须整除 960，循环时才无缝
  const wavePath = (y, h, len) => {
    let d = `M-40 ${y}`;
    for (let x = -40; x < W * 2 + 40; x += len) d += ` q${len / 2} ${-h} ${len} 0`;
    return d;
  };
  $('wave1').setAttribute('d', wavePath(348, 5, 40));
  $('wave2').setAttribute('d', wavePath(372, 3.5, 24));

  // 链条：飞轮与牙盘之间的外公切线 + 两段圆弧
  const chainD = (() => {
    const c1 = REAR, r1 = COG, c2 = BB, r2 = RING;
    const dx = c2.x - c1.x, dy = c2.y - c1.y;
    const D = Math.hypot(dx, dy), beta = Math.atan2(dy, dx);
    const a = Math.acos((r1 - r2) / D);
    const pt = (c, r, ang) => `${f(c.x + r * Math.cos(ang))} ${f(c.y + r * Math.sin(ang))}`;
    const top = beta - a, bot = beta + a;
    return `M${pt(c1, r1, top)} L${pt(c2, r2, top)} A${r2} ${r2} 0 1 1 ${pt(c2, r2, bot)} L${pt(c1, r1, bot)} A${r1} ${r1} 0 0 1 ${pt(c1, r1, top)} Z`;
  })();
  const chain = $('chain');
  chain.setAttribute('d', chainD);
  $('chainBase').setAttribute('d', chainD);
  const chainLen = chain.getTotalLength();
  const chainPeriod = chainLen / Math.round(chainLen / 7);   // 让链节数量刚好整数
  chain.setAttribute('stroke-dasharray', `${f(chainPeriod * 0.6)} ${f(chainPeriod * 0.4)}`);

  /* ---------- 二连杆反向运动学：已知髋、脚位置，求关节位置 ---------- */
  // bend = +1 时关节向后弯（鸟类可见的"膝盖"其实是脚踝，向后弯曲）
  function solveJoint(hx, hy, px, py, l1, l2, bend) {
    const dx = px - hx, dy = py - hy;
    let d = Math.hypot(dx, dy);
    d = Math.min(Math.max(d, Math.abs(l1 - l2) + 0.5), l1 + l2 - 0.5);
    const base = Math.atan2(dy, dx);
    const a = Math.acos((l1 * l1 + d * d - l2 * l2) / (2 * l1 * d));
    const ang = base + bend * a;
    return { x: hx + l1 * Math.cos(ang), y: hy + l1 * Math.sin(ang) };
  }

  /* ---------- 元素引用 ---------- */
  const scene = $('scene');
  const rearWheel = $('rearWheel'), frontWheel = $('frontWheel');
  const crankNear = $('crankNear'), crankFar = $('crankFar');
  const pedalNear = $('pedalNear'), pedalFar = $('pedalFar');
  const nearLeg = $('nearLeg'), nearLegOutline = $('nearLegOutline'), farLeg = $('farLeg');
  const nearFoot = $('nearFoot'), farFoot = $('farFoot');
  const rider = $('rider'), head = $('head'), pouch = $('pouch'), fish = $('fish');
  const roadDash = $('roadDash'), roadTex = $('roadTex');
  const layers = [
    [$('layerClouds'), 0.03],
    [$('layerHills'),  0.08],
    [$('layerWave1'),  0.12],
    [$('layerWave2'),  0.20],
    [$('layerMid'),    0.40],
  ];

  /* ---------- 状态 ---------- */
  let dist = 0;        // 已骑行距离（px），所有机械运动都由它推导，保证同步
  let elapsed = 0;     // 运行时间（s），用于与距离无关的小动作
  let speed = 1;
  let running = true;
  let last = null;

  /* ---------- 每帧渲染 ---------- */
  function render() {
    const wheelRad = dist / R_WHEEL;                 // 车轮转角（弧度，顺时针）
    const crankRad = wheelRad / RATIO;               // 曲柄转角
    const wheelDeg = (wheelRad * 180 / Math.PI) % 360;
    const crankDeg = (crankRad * 180 / Math.PI) % 360;

    rearWheel.setAttribute('transform', `translate(${REAR.x} ${REAR.y}) rotate(${f(wheelDeg)})`);
    frontWheel.setAttribute('transform', `translate(${FRONT.x} ${FRONT.y}) rotate(${f(wheelDeg)})`);
    crankNear.setAttribute('transform', `translate(${BB.x} ${BB.y}) rotate(${f(crankDeg)})`);
    crankFar.setAttribute('transform', `translate(${BB.x} ${BB.y}) rotate(${f(crankDeg)})`);

    // 链条沿路径前进：线速度 = 曲柄角速度 × 牙盘半径
    chain.setAttribute('stroke-dashoffset', f(-((crankRad * RING) % chainPeriod)));

    // 身体随蹬踏节奏轻微起伏、前后摆动
    const bob = 2.2 * Math.sin(2 * crankRad);
    const lean = 1.2 * Math.sin(crankRad);
    rider.setAttribute('transform', `translate(0 ${f(bob)}) rotate(${f(lean)} ${HIP.x} ${HIP.y})`);
    head.setAttribute('transform', `rotate(${f(2 * Math.sin(2 * crankRad + 1))} 448 238)`);
    const s = 1 + 0.06 * Math.sin(2 * crankRad + 2.2);
    pouch.setAttribute('transform', `translate(516 156) scale(1 ${f(s)}) translate(-516 -156)`);
    fish.setAttribute('transform', `rotate(${f(12 * Math.sin(elapsed * 7))} 594 206)`);

    // 脚踏位置：近侧在 crankRad，远侧相差 180°
    const hipY = HIP.y + bob;
    const legs = [
      { ang: crankRad,           pedal: pedalNear, foot: nearFoot, lines: [nearLegOutline, nearLeg] },
      { ang: crankRad + Math.PI, pedal: pedalFar,  foot: farFoot,  lines: [farLeg] },
    ];
    for (const leg of legs) {
      const px = BB.x + CRANK * Math.cos(leg.ang);
      const py = BB.y + CRANK * Math.sin(leg.ang);
      leg.pedal.setAttribute('transform', `translate(${f(px)} ${f(py)})`);
      leg.foot.setAttribute('transform', `translate(${f(px)} ${f(py - 3)})`);
      const j = solveJoint(HIP.x, hipY, px, py - 3, THIGH, SHANK, +1);
      const pts = `${HIP.x},${f(hipY)} ${f(j.x)},${f(j.y)} ${f(px - 2)},${f(py - 4)}`;
      for (const line of leg.lines) line.setAttribute('points', pts);
    }

    // 视差背景与路面标线
    for (const [layer, factor] of layers) {
      layer.setAttribute('transform', `translate(${f(-((dist * factor) % W))} 0)`);
    }
    roadDash.setAttribute('stroke-dashoffset', f(dist % 88));
    roadTex.setAttribute('stroke-dashoffset', f(dist % 400));
  }

  function loop(ts) {
    if (last === null) last = ts;
    const dt = Math.min((ts - last) / 1000, 0.05);   // 切回标签页时避免时间跳变
    last = ts;
    if (running) {
      dist += BASE_SPEED * speed * dt;
      elapsed += dt;
      render();                                      // 暂停时画面静止，不再重复写 DOM
    }
    requestAnimationFrame(loop);
  }

  /* ---------- 交互 ---------- */
  const toggleBtn = $('toggle');
  function setRunning(on) {
    running = on;
    scene.classList.toggle('paused', !on);
    toggleBtn.textContent = on ? '⏸ 暂停' : '▶ 继续';
    toggleBtn.setAttribute('aria-pressed', String(!on));
  }
  toggleBtn.addEventListener('click', () => setRunning(!running));
  $('stage').addEventListener('click', () => setRunning(!running));
  document.addEventListener('keydown', e => {
    if (e.code === 'Space' && !/^(INPUT|BUTTON)$/.test(e.target.tagName)) {
      e.preventDefault();
      setRunning(!running);
    }
  });
  const speedInput = $('speed'), speedVal = $('speedVal');
  speedInput.addEventListener('input', () => {
    speed = parseFloat(speedInput.value);
    speedVal.textContent = speed.toFixed(2).replace(/0$/, '') + '×';
  });

  // 尊重系统"减少动态效果"设置：默认静止，用户可手动播放
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    setRunning(false);
  }

  render();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
