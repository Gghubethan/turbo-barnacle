<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>黑湖工单系统</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%231857c4'/><text x='16' y='23' font-size='20' text-anchor='middle' fill='white' font-family='sans-serif'>湖</text></svg>" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="logo">湖</div>
    <div>
      <h1>黑湖工单系统</h1>
    </div>
    <span class="sub">数字化车间 · 工单全流程协同</span>
  </header>

  <nav class="tabs">
    <button data-view="dashboard" class="active">生产看板</button>
    <button data-view="orders">工单管理</button>
    <button data-view="inspections">质量检验</button>
    <button data-view="inventory">物料库存</button>
    <button data-view="exceptions">异常处理</button>
    <button data-view="products">产品档案</button>
    <button data-view="staff">员工班组</button>
  </nav>

  <main>
    <!-- 看板 -->
    <section id="dashboard" class="view active">
      <div class="stats" id="stat-cards"></div>
      <div class="card" style="padding:18px;">
        <div class="section-title"><h2>工单状态分布</h2></div>
        <div class="status-grid" id="status-grid"></div>
      </div>
    </section>

    <!-- 工单 -->
    <section id="orders" class="view">
      <div class="toolbar">
        <select id="filter-status">
          <option value="all">全部状态</option>
        </select>
        <input id="search" class="grow" placeholder="搜索工单号 / 产品 / 负责人…" />
        <button class="btn ghost" id="btn-refresh">刷新</button>
        <button class="btn" id="btn-new-order">+ 新建工单</button>
      </div>
      <div class="card">
        <table>
          <thead>
            <tr>
              <th>工单号</th><th>产品</th><th class="num">计划/完成</th>
              <th>进度</th><th>优先级</th><th>状态</th>
              <th class="hide-sm">负责人</th><th class="hide-sm">计划完工</th>
            </tr>
          </thead>
          <tbody id="orders-tbody"></tbody>
        </table>
        <div class="empty" id="orders-empty" style="display:none;">暂无工单</div>
      </div>
    </section>

    <!-- 质检 -->
    <section id="inspections" class="view">
      <div class="toolbar">
        <span class="grow"></span>
        <button class="btn" id="btn-new-insp">+ 新建检验单</button>
      </div>
      <div class="card">
        <table>
          <thead>
            <tr><th>工单号</th><th>质检员</th><th class="num">送检</th><th class="num">合格</th>
              <th class="num">不良</th><th>合格率</th><th>结论</th><th class="hide-sm">时间</th></tr>
          </thead>
          <tbody id="insp-tbody"></tbody>
        </table>
        <div class="empty" id="insp-empty" style="display:none;">暂无检验记录</div>
      </div>
    </section>

    <!-- 库存 -->
    <section id="inventory" class="view">
      <div class="toolbar">
        <span class="grow"></span>
        <button class="btn ghost" id="btn-new-material">+ 新建物料</button>
        <button class="btn subtle" id="btn-view-txns">出入库流水</button>
      </div>
      <div class="card" id="materials-card">
        <table>
          <thead>
            <tr><th>编码</th><th>名称</th><th class="hide-sm">规格</th><th>类别</th>
              <th class="num">当前库存</th><th class="num hide-sm">安全库存</th><th></th></tr>
          </thead>
          <tbody id="materials-tbody"></tbody>
        </table>
        <div class="empty" id="materials-empty" style="display:none;">暂无物料</div>
      </div>
      <div class="card" id="txns-card" style="display:none;margin-top:14px;">
        <div class="section-title" style="padding:12px 14px 0;"><h2>出入库流水</h2></div>
        <table>
          <thead>
            <tr><th>时间</th><th>物料</th><th>类型</th><th class="num">数量</th>
              <th class="num">结余</th><th class="hide-sm">关联工单</th><th class="hide-sm">操作人</th></tr>
          </thead>
          <tbody id="txns-tbody"></tbody>
        </table>
        <div class="empty" id="txns-empty" style="display:none;">暂无流水</div>
      </div>
    </section>

    <!-- 异常 -->
    <section id="exceptions" class="view">
      <div class="toolbar">
        <select id="filter-exc">
          <option value="">全部</option>
          <option value="open">待处理</option>
          <option value="resolved">已处理</option>
        </select>
        <span class="grow"></span>
        <button class="btn" id="btn-new-exc">+ 上报异常</button>
      </div>
      <div class="card">
        <table>
          <thead>
            <tr><th>关联工单</th><th>类型</th><th>描述</th><th>上报人</th><th>状态</th><th></th></tr>
          </thead>
          <tbody id="exc-tbody"></tbody>
        </table>
        <div class="empty" id="exc-empty" style="display:none;">暂无异常</div>
      </div>
    </section>

    <!-- 产品 -->
    <section id="products" class="view">
      <div class="toolbar">
        <span class="grow"></span>
        <button class="btn" id="btn-new-product">+ 新建产品</button>
      </div>
      <div class="card">
        <table>
          <thead><tr><th>编码</th><th>名称</th><th>规格</th><th>单位</th><th>创建时间</th></tr></thead>
          <tbody id="products-tbody"></tbody>
        </table>
        <div class="empty" id="products-empty" style="display:none;">暂无产品</div>
      </div>
    </section>

    <!-- 员工 -->
    <section id="staff" class="view">
      <div class="toolbar">
        <span class="grow"></span>
        <button class="btn" id="btn-new-staff">+ 新建员工</button>
      </div>
      <div class="card">
        <table>
          <thead><tr><th>姓名</th><th>角色</th><th>班组</th><th>状态</th><th></th></tr></thead>
          <tbody id="staff-tbody"></tbody>
        </table>
        <div class="empty" id="staff-empty" style="display:none;">暂无员工</div>
      </div>
    </section>
  </main>

  <!-- 工单详情抽屉 -->
  <div class="overlay" id="overlay"></div>
  <aside class="drawer" id="drawer">
    <header>
      <h3 id="drawer-title">工单详情</h3>
      <button class="close-x" data-close-drawer>&times;</button>
    </header>
    <div class="body" id="drawer-body"></div>
  </aside>

  <!-- 通用弹窗（表单注入） -->
  <div class="modal" id="modal">
    <header><h3 id="modal-title"></h3><button class="close-x" data-close-modal>&times;</button></header>
    <div class="body" id="modal-body"></div>
    <footer>
      <button class="btn subtle" data-close-modal>取消</button>
      <button class="btn" id="modal-submit">确定</button>
    </footer>
  </div>

  <div id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
